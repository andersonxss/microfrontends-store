name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - staging
      - production
  pull_request:
    branches:
      - main
      - master
      - dev
      - staging
      - production

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  deploy-remotes:
    name: Deploy ${{ matrix.app }} to Vercel
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && contains(fromJSON('["dev", "staging", "production"]'), github.ref_name)
    environment:
      name: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - shell
          - products
          - cart
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app == 'products' && secrets.VERCEL_PRODUCTS_PROJECT_ID || matrix.app == 'cart' && secrets.VERCEL_CART_PROJECT_ID || secrets.VERCEL_SHELL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SHELL_REMOTE_URL: ${{ vars.VITE_SHELL_REMOTE_URL }}
      VITE_PRODUCTS_REMOTE_URL: ${{ vars.VITE_PRODUCTS_REMOTE_URL }}
      VITE_CART_REMOTE_URL: ${{ vars.VITE_CART_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup deployment target
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "VERCEL_ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "VERCEL_DEPLOY_ARGS=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENVIRONMENT=preview" >> "$GITHUB_ENV"
            echo "VERCEL_DEPLOY_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Validate Vercel configuration
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is required."
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_ORG_ID secret is required."
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL project ID secret is required for ${{ matrix.app }}."
            exit 1
          fi

          if [ "${{ matrix.app }}" = "products" ] && [ -z "$VITE_PRODUCTS_REMOTE_URL" ]; then
            echo "VITE_PRODUCTS_REMOTE_URL variable is required."
            exit 1
          fi

          if [ "${{ matrix.app }}" = "cart" ] && [ -z "$VITE_CART_REMOTE_URL" ]; then
            echo "VITE_CART_REMOTE_URL variable is required."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Clear local Vercel config
        run: |
          find . -type d -name .vercel -prune -exec rm -rf {} +
          echo "Remaining .vercel directories:"
          find . -type d -name .vercel -print

      - name: Diagnose Vercel identifiers
        run: |
          echo "Project target: ${{ matrix.app }}"
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"
          echo "VERCEL_ORG_ID prefix: ${VERCEL_ORG_ID:0:5}"
          echo "VERCEL_PROJECT_ID prefix: ${VERCEL_PROJECT_ID:0:4}"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --workspace @mfe/${{ matrix.app }}

      - name: Verify Vercel project access
        run: |
          status_code=$(curl --silent --show-error --output /tmp/vercel-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          echo "Vercel project access status: $status_code"

          if [ "$status_code" != "200" ]; then
            echo "The Vercel token, org ID, and project ID do not match a project that this workflow can access."
            cat /tmp/vercel-project.json
            exit 1
          fi

      - name: Deploy Vercel project
        id: deploy
        run: |
          deployment_url=$(vercel deploy . $VERCEL_DEPLOY_ARGS --yes --token="$VERCEL_TOKEN")
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app }} deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-shell:
    name: Deploy shell to Vercel
    runs-on: ubuntu-latest
    needs:
      - check
      - deploy-remotes
    if: github.event_name == 'push' && contains(fromJSON('["dev", "staging", "production"]'), github.ref_name)
    environment:
      name: ${{ github.ref_name }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SHELL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VITE_SHELL_REMOTE_URL: ${{ vars.VITE_SHELL_REMOTE_URL }}
      VITE_PRODUCTS_REMOTE_URL: ${{ vars.VITE_PRODUCTS_REMOTE_URL }}
      VITE_CART_REMOTE_URL: ${{ vars.VITE_CART_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup deployment target
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "VERCEL_ENVIRONMENT=production" >> "$GITHUB_ENV"
            echo "VERCEL_DEPLOY_ARGS=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENVIRONMENT=preview" >> "$GITHUB_ENV"
            echo "VERCEL_DEPLOY_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Validate Vercel configuration
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret is required."
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_ORG_ID secret is required."
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_SHELL_PROJECT_ID secret is required."
            exit 1
          fi

          if [ -z "$VITE_SHELL_REMOTE_URL" ]; then
            echo "VITE_SHELL_REMOTE_URL variable is required."
            exit 1
          fi

          if [ -z "$VITE_PRODUCTS_REMOTE_URL" ]; then
            echo "VITE_PRODUCTS_REMOTE_URL variable is required."
            exit 1
          fi

          if [ -z "$VITE_CART_REMOTE_URL" ]; then
            echo "VITE_CART_REMOTE_URL variable is required."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Clear local Vercel config
        run: |
          find . -type d -name .vercel -prune -exec rm -rf {} +
          echo "Remaining .vercel directories:"
          find . -type d -name .vercel -print

      - name: Diagnose Vercel identifiers
        run: |
          echo "Project target: shell"
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"
          echo "VERCEL_ORG_ID prefix: ${VERCEL_ORG_ID:0:5}"
          echo "VERCEL_PROJECT_ID prefix: ${VERCEL_PROJECT_ID:0:4}"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build --workspace @mfe/shell

      - name: Verify Vercel project access
        run: |
          status_code=$(curl --silent --show-error --output /tmp/vercel-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          echo "Vercel project access status: $status_code"

          if [ "$status_code" != "200" ]; then
            echo "The Vercel token, org ID, and project ID do not match a project that this workflow can access."
            cat /tmp/vercel-project.json
            exit 1
          fi

      - name: Deploy Vercel project
        id: deploy
        run: |
          deployment_url=$(vercel deploy . $VERCEL_DEPLOY_ARGS --yes --token="$VERCEL_TOKEN")
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### shell deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
