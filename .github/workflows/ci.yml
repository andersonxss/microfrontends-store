name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - staging
      - production
  pull_request:
    branches:
      - main
      - master
      - dev
      - staging
      - production

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

  environment-build:
    name: Build ${{ github.ref_name }} environment
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && contains(fromJSON('["dev", "staging", "production"]'), github.ref_name)
    environment:
      name: ${{ github.ref_name }}
    env:
      VITE_SHELL_REMOTE_URL: ${{ vars.VITE_SHELL_REMOTE_URL }}
      VITE_PRODUCTS_REMOTE_URL: ${{ vars.VITE_PRODUCTS_REMOTE_URL }}
      VITE_CART_REMOTE_URL: ${{ vars.VITE_CART_REMOTE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment variables
        run: |
          if [ -z "$VITE_SHELL_REMOTE_URL" ]; then
            echo "VITE_SHELL_REMOTE_URL is required for the ${{ github.ref_name }} environment."
            exit 1
          fi

          echo "Building for environment: $VITE_SHELL_REMOTE_URL"
          if [ -z "$VITE_PRODUCTS_REMOTE_URL" ]; then
            echo "VITE_PRODUCTS_REMOTE_URL is required for the ${{ github.ref_name }} environment."
            exit 1
          fi

          if [ -z "$VITE_CART_REMOTE_URL" ]; then
            echo "VITE_CART_REMOTE_URL is required for the ${{ github.ref_name }} environment."
            exit 1
          fi

      - name: Build application
        run: npm run build
